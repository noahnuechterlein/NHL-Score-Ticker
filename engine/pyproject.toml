[project]
name = "nhl-ticker"
version = "0.1.0"
description = "NHL score ticker engine: polls the NHL API and drives an Arduino LED board"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # zoneinfo reads the operating system's tz database, which Windows does not have at
    # all and minimal Linux images often omit. Shipping it keeps start times correct
    # everywhere rather than only on hosts that happen to have tzdata installed.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Audio is optional: the engine runs board-only without it, and the sink degrades to
# logging rather than failing if the package is absent.
horn = [
    "just-playback>=0.1.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[project.scripts]
nhl-ticker = "nhl_ticker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
